# HyperTransfer 一键部署:前端(nginx 静态+反代) + 后端(FastAPI) + SQLite 持久化卷
# 用法:  docker compose up -d --build
# 访问:  http://<服务器IP>:${WEB_PORT:-8080}

services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      # SQLite 落在持久化卷,容器重建数据不丢
      HT_DB_PATH: /data/hypertransfer_auth.db
    volumes:
      - ht-db:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # 不对外暴露端口,仅通过内部网络被 nginx 访问

  web:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  ht-db:
