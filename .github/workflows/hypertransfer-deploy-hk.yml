name: HyperTransfer Deploy HK

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/hypertransfer-deploy-hk.yml"
      - "hypertransfer-main/**"
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment target"
        required: true
        type: choice
        default: staging
        options:
          - staging
          - production

concurrency:
  group: hypertransfer-hk-${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'staging' }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to HK (${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'staging' }})
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'staging' }}

    env:
      DEPLOY_ENVIRONMENT: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'staging' }}
      HK_HOST: ${{ secrets.HK_HOST }}
      HK_SSH_PORT: ${{ secrets.HK_SSH_PORT }}
      HK_SSH_USER: ${{ secrets.HK_SSH_USER }}
      HK_SSH_KEY: ${{ secrets.HK_SSH_KEY }}
      HK_SSH_KNOWN_HOSTS: ${{ secrets.HK_SSH_KNOWN_HOSTS }}
      HK_DEPLOY_PATH: ${{ secrets.HK_DEPLOY_PATH }}
      HK_ENV_FILE: ${{ secrets.HK_ENV_FILE }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check deployment secrets
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          # HK 服务器/密钥未配齐时优雅跳过(job 仍 green), 避免每次 push main 都收到"部署失败"邮件;
          # 配置 HK_HOST/HK_SSH_USER/HK_SSH_KEY 后自动启用真实部署(见 DEPLOY.md §5)。
          # 真实失败(密钥已配但服务器不可达/构建失败)仍会如实 fail。
          if [ -z "${HK_HOST:-}" ] || [ -z "${HK_SSH_USER:-}" ] || [ -z "${HK_SSH_KEY:-}" ]; then
            echo "::notice title=HK deploy skipped::HK_HOST/HK_SSH_USER/HK_SSH_KEY 未配置, 跳过自动部署。配置 secrets 后即自动启用(DEPLOY.md §5)。"
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare SSH
        if: steps.guard.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$HK_SSH_KEY" > ~/.ssh/hk_deploy_key
          chmod 600 ~/.ssh/hk_deploy_key
          if [ -n "${HK_SSH_KNOWN_HOSTS:-}" ]; then
            printf '%s\n' "$HK_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "${HK_SSH_PORT:-22}" "$HK_HOST" >> ~/.ssh/known_hosts
          fi

      - name: Sync repository to HK server
        if: steps.guard.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          DEPLOY_PATH="${HK_DEPLOY_PATH:-/opt/hypertransfer/app}"
          SSH="ssh -i ~/.ssh/hk_deploy_key -p ${HK_SSH_PORT:-22}"
          $SSH "${HK_SSH_USER}@${HK_HOST}" "mkdir -p '${DEPLOY_PATH}'"
          RSYNC_RSH="$SSH" rsync -az --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'hypertransfer-main/.env' \
            --exclude 'hypertransfer-main/.env.local' \
            --exclude 'hypertransfer-main/.env.development.local' \
            --exclude 'hypertransfer-main/.env.test.local' \
            --exclude 'hypertransfer-main/.env.production.local' \
            --exclude 'hypertransfer-main/backups/' \
            --exclude 'hypertransfer-main/node_modules/' \
            --exclude 'hypertransfer-main/dist/' \
            --exclude 'hypertransfer-main/backend/.venv/' \
            --exclude 'hypertransfer-main/backend/*.db' \
            --exclude 'hypertransfer-main/backend/*.log' \
            ./ "${HK_SSH_USER}@${HK_HOST}:${DEPLOY_PATH}/"

      - name: Write server environment file
        if: steps.guard.outputs.configured == 'true' && env.HK_ENV_FILE != ''
        shell: bash
        run: |
          set -euo pipefail
          DEPLOY_PATH="${HK_DEPLOY_PATH:-/opt/hypertransfer/app}"
          SSH="ssh -i ~/.ssh/hk_deploy_key -p ${HK_SSH_PORT:-22}"
          printf '%s\n' "$HK_ENV_FILE" > /tmp/hypertransfer.env
          scp -i ~/.ssh/hk_deploy_key -P "${HK_SSH_PORT:-22}" \
            /tmp/hypertransfer.env \
            "${HK_SSH_USER}@${HK_HOST}:${DEPLOY_PATH}/hypertransfer-main/.env"
          $SSH "${HK_SSH_USER}@${HK_HOST}" "chmod 600 '${DEPLOY_PATH}/hypertransfer-main/.env'"

      - name: Deploy with Docker Compose
        if: steps.guard.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          DEPLOY_PATH="${HK_DEPLOY_PATH:-/opt/hypertransfer/app}"
          SSH="ssh -i ~/.ssh/hk_deploy_key -p ${HK_SSH_PORT:-22}"
          $SSH "${HK_SSH_USER}@${HK_HOST}" \
            "DEPLOY_PATH='${DEPLOY_PATH}' DEPLOY_ENVIRONMENT='${DEPLOY_ENVIRONMENT}' GITHUB_SHA='${GITHUB_SHA}' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$DEPLOY_PATH/hypertransfer-main"

          if [ ! -f .env ]; then
            cp .env.example .env
            chmod 600 .env
          fi

          if [ "$DEPLOY_ENVIRONMENT" = "production" ]; then
            if grep -Eq '^HT_ALLOWED_ORIGINS=\*$' .env; then
              echo "Production deploy blocked: HT_ALLOWED_ORIGINS must not be *."
              exit 1
            fi
            if grep -Eq '^SMS_API_URL=https://hv-test\.hypervelocity\.cn/' .env; then
              echo "Production deploy blocked: SMS_API_URL still points to QA gateway."
              exit 1
            fi
          fi

          WEB_PORT="$(awk -F= '$1=="WEB_PORT"{print $2}' .env | tail -n 1)"
          WEB_PORT="${WEB_PORT:-8080}"
          export VITE_GIT_COMMIT="${GITHUB_SHA::7}"

          mkdir -p backups
          if docker compose ps --services --filter status=running | grep -qx backend; then
            docker compose cp backend:/data/hypertransfer_auth.db \
              "backups/hypertransfer_auth_$(date +%Y%m%d_%H%M%S).db" || true
          fi

          docker compose up -d --build --remove-orphans

          for _ in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:${WEB_PORT}/api/health"; then
              printf '\nDeployed %s to %s at %s\n' "$GITHUB_SHA" "$DEPLOY_ENVIRONMENT" "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
              exit 0
            fi
            sleep 3
          done

          docker compose ps
          docker compose logs --tail=120 backend
          exit 1
          REMOTE
